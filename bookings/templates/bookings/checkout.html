<div class="container py-4">
  <h4 class="mb-4">Booking: {{ space.name }}</h4>

  <div class="card mb-4 shadow-sm">
    {% if space.image %}
      <img src="{{ space.image.url }}" class="card-img-top" alt="{{ space.name }}">
    {% endif %}
    <div class="card-body">
        <h5 class="card-title text-primary">{{ space.name }}</h5>
      <p><strong>Type:</strong> {{ space.get_space_type_display }}</p>
      <p><strong>Price per Day:</strong> ₦<span id="spacePrice">{{ space.price|default:"0.00" }}</span></p>
      <p><strong>Days Selected:</strong> <span id="daysCount">0</span></p>
      <p><strong>Total Amount:</strong> ₦<span id="totalAmount">0.00</span></p>
    </div>
  </div>

  <form method="POST" class="needs-validation" novalidate>
    {% csrf_token %}
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="id_check_in" class="form-label">Check-in</label>
        {{ form.check_in }}
      </div>
      <div class="col-md-6">
        <label for="id_check_out" class="form-label">Check-out</label>
        {{ form.check_out }}
      </div>
    </div>
    <input type="hidden" name="calculated_amount" id="calculatedAmountInput">
    <button type="submit" class="btn btn-success">Confirm Booking</button>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const priceText = document.getElementById("spacePrice").textContent;
    const price = parseFloat(priceText.replace(/[^\d.]/g, '')) || 0;

    const checkIn = document.getElementById("id_check_in");
    const checkOut = document.getElementById("id_check_out");
    const totalAmount = document.getElementById("totalAmount");
    const daysCount = document.getElementById("daysCount");
    const amountInput = document.getElementById("calculatedAmountInput");

    function calculateTotal() {
      const inDate = new Date(checkIn.value);
      const outDate = new Date(checkOut.value);
      const timeDiff = outDate - inDate;
      const days = timeDiff / (1000 * 3600 * 24);

      if (!isNaN(days) && days > 0) {
        const total = days * price;
        daysCount.textContent = days;
        totalAmount.textContent = total.toFixed(2);
        amountInput.value = total.toFixed(2);
      } else {
        daysCount.textContent = '0';
        totalAmount.textContent = '0.00';
        amountInput.value = '';
      }
    }

    checkIn.addEventListener('change', calculateTotal);
    checkOut.addEventListener('change', calculateTotal);

    // Run on load if dates are already filled
    calculateTotal();
  });
</script>
